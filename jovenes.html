<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ministerio de Jóvenes | Jesús es mi Pastor</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#173b29;background:#f7f7f2}
header{background:#173b29;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;color:#fff}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}.brand img{width:58px;height:58px;border-radius:50%;object-fit:cover}
.back{color:#fff;text-decoration:none;font-weight:bold}main{max-width:1100px;margin:auto;padding:60px 5%}
h1{font-size:42px;margin-bottom:12px}.intro{font-size:18px;max-width:820px;line-height:1.7}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:25px}
.photo{height:240px;border-radius:16px;background:#e9eee9;border:2px dashed #9bad9f;display:flex;align-items:center;justify-content:center;text-align:center;color:#587060;padding:20px}
@media(max-width:700px){h1{font-size:32px}.gallery{grid-template-columns:1fr}}
.youth-gallery{grid-template-columns:repeat(2,1fr)}
.photo-real{margin:0;overflow:hidden;border-radius:16px;background:#fff;box-shadow:0 10px 25px rgba(0,0,0,.12)}
.photo-real img{display:block;width:100%;height:auto}
.photo-real figcaption{padding:10px 14px;font-weight:700}
@media(max-width:700px){.youth-gallery{grid-template-columns:1fr}}

.photo-real{cursor:zoom-in}.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;align-items:center;justify-content:center;padding:20px}.lightbox.open{display:flex}.lightbox img{max-width:92vw;max-height:86vh;object-fit:contain;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)}.lb-close,.lb-prev,.lb-next{position:absolute;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:50%;width:46px;height:46px;font-size:28px;cursor:pointer}.lb-close{top:18px;right:20px}.lb-prev{left:20px}.lb-next{right:20px}.lb-counter{position:absolute;bottom:18px;color:#fff;font-size:14px}
</style><style>
body{background:linear-gradient(135deg,#0b1f16,#173b2a)!important;color:#f7f1e4!important}
main{color:#f7f1e4!important}
main h1{color:#f2d28a!important}
.intro{color:#eee5d5!important}
.block,.ministry,.photo-real{background:linear-gradient(145deg,#1b4933,#123322)!important;color:#f7f1e4!important;border:1px solid rgba(214,178,92,.35)!important;box-shadow:0 12px 30px rgba(0,0,0,.24)!important}
.block h2{color:#f2d28a!important}
.ministry h3{color:#f2d28a!important}
.photo-real figcaption{background:#123322!important;color:#f2d28a!important}
.gallery h2,h2{color:#f2d28a}
</style></head><body>
<header><a class="brand" href="index.html"><img src="logo.jpg" alt="Logo"><strong>Jesús es mi Pastor</strong></a><a class="back" href="index.html">← Volver</a></header>
<main><h1>Ministerio de Jóvenes</h1><p class="intro">Ayudar a los jóvenes a conocer a Cristo, crecer en la fe, desarrollar sus dones y servir.</p><h2>Fotos del ministerio</h2>
<div class="gallery youth-gallery"><figure class="photo-real" onclick="openLightbox(0)"><img src="jovenes_1.jpg" alt="Ministerio de Jóvenes - foto 1"><figcaption>Ministerio de Jóvenes</figcaption></figure><figure class="photo-real" onclick="openLightbox(1)"><img src="jovenes_2.jpg" alt="Ministerio de Jóvenes - foto 2"><figcaption>Ministerio de Jóvenes</figcaption></figure><figure class="photo-real" onclick="openLightbox(2)"><img src="jovenes_3.jpg" alt="Ministerio de Jóvenes - foto 3"><figcaption>Ministerio de Jóvenes</figcaption></figure><figure class="photo-real" onclick="openLightbox(3)"><img src="jovenes_4.jpg" alt="Ministerio de Jóvenes - foto 4"><figcaption>Ministerio de Jóvenes</figcaption></figure><figure class="photo-real" onclick="openLightbox(4)"><img src="jovenes_5.jpg" alt="Ministerio de Jóvenes - foto 5"><figcaption>Ministerio de Jóvenes</figcaption></figure><figure class="photo-real" onclick="openLightbox(5)"><img src="jovenes_6.jpg" alt="Ministerio de Jóvenes - foto 6"><figcaption>Ministerio de Jóvenes</figcaption></figure><figure class="photo-real" onclick="openLightbox(6)"><img src="jovenes_7.jpg" alt="Ministerio de Jóvenes - foto 7"><figcaption>Ministerio de Jóvenes</figcaption></figure></div></main><div class="lightbox" id="lightbox" role="dialog" aria-modal="true" onclick="closeIfBackdrop(event)"><button class="lb-close" onclick="closeLightbox(event)">×</button><button class="lb-prev" onclick="prevPhoto(event)">‹</button><img id="lbImage" src="" alt=""><button class="lb-next" onclick="nextPhoto(event)">›</button><div class="lb-counter" id="lbCounter"></div></div>
<script>const galleryImages=[{src:'jovenes_1.jpg',alt:'Ministerio de Jóvenes - foto 1'},{src:'jovenes_2.jpg',alt:'Ministerio de Jóvenes - foto 2'},{src:'jovenes_3.jpg',alt:'Ministerio de Jóvenes - foto 3'},{src:'jovenes_4.jpg',alt:'Ministerio de Jóvenes - foto 4'},{src:'jovenes_5.jpg',alt:'Ministerio de Jóvenes - foto 5'},{src:'jovenes_6.jpg',alt:'Ministerio de Jóvenes - foto 6'},{src:'jovenes_7.jpg',alt:'Ministerio de Jóvenes - foto 7'}];let currentPhoto=0;function openLightbox(i){currentPhoto=i;document.getElementById('lightbox').classList.add('open');showPhoto();document.body.style.overflow='hidden'}function showPhoto(){const x=galleryImages[currentPhoto];document.getElementById('lbImage').src=x.src;document.getElementById('lbImage').alt=x.alt;document.getElementById('lbCounter').textContent=(currentPhoto+1)+' / '+galleryImages.length}function closeLightbox(e){if(e)e.stopPropagation();document.getElementById('lightbox').classList.remove('open');document.body.style.overflow=''}function closeIfBackdrop(e){if(e.target.id==='lightbox')closeLightbox()}function prevPhoto(e){e.stopPropagation();currentPhoto=(currentPhoto-1+galleryImages.length)%galleryImages.length;showPhoto()}function nextPhoto(e){e.stopPropagation();currentPhoto=(currentPhoto+1)%galleryImages.length;showPhoto()}document.addEventListener('keydown',e=>{if(!document.getElementById('lightbox').classList.contains('open'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')prevPhoto(e);if(e.key==='ArrowRight')nextPhoto(e)})</script>
</body></html>
